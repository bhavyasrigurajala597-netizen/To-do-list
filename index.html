<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List - Modern Task Management</title>
  <meta name="description" content="A modern, responsive, and user-friendly To-Do List web application with priority tracking, due dates, sorting, filtering, statistics, and dark mode." />
  <meta property="og:title" content="My To-Do List" />
  <meta property="og:description" content="A modern, responsive, and user-friendly To-Do List web application with priority tracking, due dates, sorting, filtering, statistics, and dark mode." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    /* ==========================================================================
       CSS VARIABLES & THEME DEFINITIONS
       ========================================================================== */
    :root {
      /* Light Theme (Default) */
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-secondary: #f1f5f9;
      --bg-surface-tertiary: #e2e8f0;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      
      --border-subtle: #e2e8f0;
      --border-focus: #3b82f6;
      
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-subtle: #eff6ff;
      --primary-text: #1d4ed8;

      --priority-high-bg: #fef2f2;
      --priority-high-text: #b91c1c;
      --priority-high-border: #fecaca;
      --priority-high-dot: #ef4444;

      --priority-med-bg: #fffbeb;
      --priority-med-text: #b45309;
      --priority-med-border: #fde68a;
      --priority-med-dot: #f59e0b;

      --priority-low-bg: #f0fdf4;
      --priority-low-text: #15803d;
      --priority-low-border: #bbf7d0;
      --priority-low-dot: #22c55e;

      --overdue-bg: #fff1f2;
      --overdue-text: #e11d48;
      --overdue-border: #fecdd3;

      --today-bg: #fefce8;
      --today-text: #a16207;
      --today-border: #fef08a;

      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-subtle: #fef2f2;
      --danger-text: #b91c1c;

      --success: #10b981;
      --success-hover: #059669;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.06);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;

      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      /* Dark Theme */
      --bg-body: #0b0f17;
      --bg-surface: #131b2a;
      --bg-surface-secondary: #1c2638;
      --bg-surface-tertiary: #27354a;

      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;

      --border-subtle: #243044;
      --border-focus: #60a5fa;

      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-subtle: rgba(59, 130, 246, 0.15);
      --primary-text: #93c5fd;

      --priority-high-bg: rgba(239, 68, 68, 0.15);
      --priority-high-text: #fca5a5;
      --priority-high-border: rgba(239, 68, 68, 0.3);
      --priority-high-dot: #f87171;

      --priority-med-bg: rgba(245, 158, 11, 0.15);
      --priority-med-text: #fcd34d;
      --priority-med-border: rgba(245, 158, 11, 0.3);
      --priority-med-dot: #fbbf24;

      --priority-low-bg: rgba(34, 197, 94, 0.15);
      --priority-low-text: #86efac;
      --priority-low-border: rgba(34, 197, 94, 0.3);
      --priority-low-dot: #4ade80;

      --overdue-bg: rgba(225, 29, 72, 0.2);
      --overdue-text: #fda4af;
      --overdue-border: rgba(225, 29, 72, 0.4);

      --today-bg: rgba(234, 179, 8, 0.15);
      --today-text: #fde047;
      --today-border: rgba(234, 179, 8, 0.3);

      --danger: #f87171;
      --danger-hover: #ef4444;
      --danger-subtle: rgba(239, 68, 68, 0.15);
      --danger-text: #fca5a5;

      --success: #34d399;
      --success-hover: #10b981;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      outline: none;
      transition: var(--transition);
      user-select: none;
    }

    /* Prevent child SVGs/spans from obstructing button click event targets */
    button svg, 
    button span, 
    .filter-btn svg, 
    .filter-btn span, 
    .task-action-btn svg, 
    .btn-add svg, 
    .btn-footer svg, 
    .custom-checkbox svg {
      pointer-events: none;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    button:active {
      transform: scale(0.97);
    }

    .app-container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 20px 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* HEADER */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
    }

    .brand-text h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.2;
    }

    .current-date {
      font-size: 0.825rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg-surface-secondary);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      font-size: 0.85rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .theme-toggle-btn:hover {
      background: var(--bg-surface-tertiary);
      transform: translateY(-1px);
    }

    .theme-toggle-btn svg {
      width: 18px;
      height: 18px;
    }

    /* STATS DASHBOARD */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.775rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-icon {
      width: 18px;
      height: 18px;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.1;
    }

    .stat-card.stat-completed .stat-value { color: var(--success); }
    .stat-card.stat-pending .stat-value { color: var(--primary); }
    .stat-card.stat-overdue .stat-value { color: var(--danger); }
    .stat-card.stat-high .stat-value { color: var(--priority-high-text); }

    .progress-banner {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .progress-banner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .progress-status-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
    }

    .progress-bar-track {
      width: 100%;
      height: 10px;
      background: var(--bg-surface-secondary);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6 0%, #10b981 100%);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* ADD TASK FORM */
    .add-task-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .add-task-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-main-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
    }

    .task-input {
      width: 100%;
      padding: 13px 16px;
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      color: var(--text-main);
      transition: var(--transition);
    }

    .task-input::placeholder {
      color: var(--text-subtle);
    }

    .task-input:focus {
      background: var(--bg-surface);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-subtle);
    }

    .form-options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .options-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .custom-select, .date-input {
      padding: 8px 12px;
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
    }

    .custom-select:focus, .date-input:focus {
      border-color: var(--border-focus);
      background: var(--bg-surface);
    }

    .btn-add {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      background: var(--primary);
      color: #ffffff;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-add:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
    }

    .btn-add svg {
      width: 18px;
      height: 18px;
    }

    /* CONTROLS */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-sort-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-subtle);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 11px 38px 11px 40px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      font-size: 0.9rem;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-subtle);
    }

    .search-clear-btn {
      position: absolute;
      right: 12px;
      color: var(--text-subtle);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
    }

    .search-clear-btn:hover {
      color: var(--text-main);
      background: var(--bg-surface-secondary);
    }

    .search-clear-btn svg {
      width: 14px;
      height: 14px;
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .sort-control label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .sort-select {
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-lg);
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .filter-btn:hover {
      color: var(--text-main);
      background: var(--bg-surface-secondary);
    }

    .filter-btn.active {
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
    }

    .filter-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--bg-surface-secondary);
      color: var(--text-main);
    }

    .filter-btn.active .filter-count {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* TASK LIST */
    .task-list-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 200px;
    }

    .task-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: var(--transition);
      position: relative;
    }

    .task-card:hover {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .task-card.is-completed {
      background: var(--bg-surface-secondary);
      border-color: var(--border-subtle);
      opacity: 0.8;
    }

    .task-card.is-completed .task-title {
      text-decoration: line-through;
      color: var(--text-subtle);
    }

    .task-checkbox-wrapper {
      padding-top: 2px;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--text-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      background: var(--bg-surface);
      flex-shrink: 0;
    }

    .custom-checkbox:hover {
      border-color: var(--primary);
    }

    .task-card.is-completed .custom-checkbox {
      background: var(--success);
      border-color: var(--success);
      color: #ffffff;
    }

    .custom-checkbox svg {
      width: 14px;
      height: 14px;
      stroke-width: 3;
      display: none;
    }

    .task-card.is-completed .custom-checkbox svg {
      display: block;
    }

    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .task-title {
      font-size: 0.975rem;
      font-weight: 500;
      color: var(--text-main);
      word-break: break-word;
      line-height: 1.4;
      transition: var(--transition);
    }

    .task-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.775rem;
    }

    .priority-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.725rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .priority-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .badge-high {
      background: var(--priority-high-bg);
      color: var(--priority-high-text);
      border: 1px solid var(--priority-high-border);
    }
    .badge-high .dot { background: var(--priority-high-dot); }

    .badge-medium {
      background: var(--priority-med-bg);
      color: var(--priority-med-text);
      border: 1px solid var(--priority-med-border);
    }
    .badge-medium .dot { background: var(--priority-med-dot); }

    .badge-low {
      background: var(--priority-low-bg);
      color: var(--priority-low-text);
      border: 1px solid var(--priority-low-border);
    }
    .badge-low .dot { background: var(--priority-low-dot); }

    .due-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.725rem;
      font-weight: 500;
      background: var(--bg-surface-secondary);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .due-badge svg {
      width: 12px;
      height: 12px;
    }

    .due-badge.overdue {
      background: var(--overdue-bg);
      color: var(--overdue-text);
      border-color: var(--overdue-border);
      font-weight: 600;
    }

    .due-badge.today {
      background: var(--today-bg);
      color: var(--today-text);
      border-color: var(--today-border);
      font-weight: 600;
    }

    .created-time {
      color: var(--text-subtle);
      font-size: 0.725rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .created-time svg {
      width: 12px;
      height: 12px;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .task-action-btn {
      padding: 8px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task-action-btn:hover {
      background: var(--bg-surface-secondary);
      color: var(--text-main);
    }

    .task-action-btn.btn-delete:hover {
      background: var(--danger-subtle);
      color: var(--danger);
    }

    .task-action-btn svg {
      width: 16px;
      height: 16px;
    }

    /* INLINE EDIT */
    .task-edit-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .task-edit-input {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-focus);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .task-edit-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .task-edit-fields {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .task-edit-buttons {
      display: flex;
      gap: 6px;
    }

    .btn-edit-save {
      padding: 6px 14px;
      background: var(--primary);
      color: #ffffff;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .btn-edit-save:hover {
      background: var(--primary-hover);
    }

    .btn-edit-cancel {
      padding: 6px 12px;
      background: var(--bg-surface-secondary);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
    }

    .btn-edit-cancel:hover {
      background: var(--bg-surface-tertiary);
    }

    /* EMPTY STATE */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: var(--bg-surface);
      border: 2px dashed var(--border-subtle);
      border-radius: var(--radius-xl);
      text-align: center;
      gap: 12px;
    }

    .empty-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--bg-surface-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .empty-icon-wrap svg {
      width: 32px;
      height: 32px;
    }

    .empty-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .empty-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      max-width: 380px;
    }

    .btn-empty-action {
      margin-top: 4px;
      padding: 8px 16px;
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .btn-empty-action:hover {
      background: var(--bg-surface-tertiary);
    }

    /* FOOTER */
    .app-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      gap: 12px;
    }

    .footer-left {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .btn-footer {
      padding: 8px 14px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-surface-secondary);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-footer:hover {
      color: var(--text-main);
      background: var(--bg-surface-tertiary);
    }

    .btn-footer.btn-danger-action:hover {
      color: var(--danger-text);
      background: var(--danger-subtle);
      border-color: var(--priority-high-border);
    }

    .btn-footer svg {
      width: 14px;
      height: 14px;
    }

    /* TOASTS */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      color: var(--text-main);
      font-size: 0.875rem;
      font-weight: 500;
      min-width: 260px;
      max-width: 380px;
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: opacity 0.3s, transform 0.3s;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .toast.hide {
      opacity: 0;
      transform: translateY(12px) scale(0.95);
    }

    .toast-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .toast.toast-success .toast-icon { color: var(--success); }
    .toast.toast-danger .toast-icon { color: var(--danger); }
    .toast.toast-info .toast-icon { color: var(--primary); }

    .toast-message {
      flex: 1;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      max-width: 440px;
      width: 100%;
      padding: 24px;
      box-shadow: var(--shadow-xl);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: modalScaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalScaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-warning-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--danger-subtle);
      color: var(--danger);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-warning-icon svg {
      width: 22px;
      height: 22px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-body {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .modal-btn-cancel {
      padding: 9px 16px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-secondary);
      color: var(--text-main);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .modal-btn-cancel:hover {
      background: var(--bg-surface-tertiary);
    }

    .modal-btn-confirm {
      padding: 9px 18px;
      background: var(--danger);
      color: #ffffff;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3);
    }

    .modal-btn-confirm:hover {
      background: var(--danger-hover);
    }

    /* RESPONSIVE */
    @media (max-width: 820px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 640px) {
      .app-container {
        padding: 16px 12px 32px;
        gap: 16px;

      }

      }

        flex-direction: column;

      }

        flex-direction: column;
        align-items: stretch;
      }

      .app-footer {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .footer-actions {
        justify-content: center;
      }

      .toast-container {
        left: 16px;
        right: 16px;
        bottom: 16px;
      }

      .toast {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /**
     * ========================================================================
     * TASK MANAGEMENT LOGIC WITH SAFE STORAGE & EVENT DELEGATION
     * All buttons are dual-bound via direct addEventListener and delegated listeners.
     * ========================================================================
     */

    const STORAGE_KEY = 'todo_app_tasks_v2';
    const THEME_KEY = 'todo_app_theme';

    // In-memory fallback if localStorage is blocked by iframe security sandbox
    const memoryStore = {};

    function safeGetStorage(key) {
      try {
        if (typeof window !== 'undefined' && window.localStorage) {
          return window.localStorage.getItem(key);
        }
      } catch (e) {
        console.warn('LocalStorage unavailable, using fallback', e);
      }
      return memoryStore[key] || null;
    }

    function safeSetStorage(key, value) {
      try {
        if (typeof window !== 'undefined' && window.localStorage) {
          window.localStorage.setItem(key, value);
          return;
        }
      } catch (e) {
        console.warn('LocalStorage unavailable, using fallback', e);
      }
      memoryStore[key] = String(value);
    }

    let tasks = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let currentSort = 'newest';
    let editingTaskId = null;
    let pendingModalAction = null;

    /**
     * Core Application Functions
     */
    function initCurrentDate() {
      const dateEl = document.getElementById('currentDateDisplay');
      if (!dateEl) return;
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
      dateEl.textContent = now.toLocaleDateString('en-US', options);

      const todayString = now.toISOString().split('T')[0];
      const dueDateInput = document.getElementById('dueDateInput');
      if (dueDateInput) {
        dueDateInput.setAttribute('min', todayString);
      }
    }

    function loadTasks() {
      try {
        const stored = safeGetStorage(STORAGE_KEY);
        if (stored) {
          tasks = JSON.parse(stored);
        } else {
          loadSampleTasks(false);
          return;
        }
      } catch (err) {
        console.error('Failed to parse tasks', err);
        tasks = [];
      }
      renderTasks();
      updateStatistics();
    }

    function saveTasks() {
      try {
        safeSetStorage(STORAGE_KEY, JSON.stringify(tasks));
      } catch (err) {
        console.error('Failed to save tasks', err);
      }
      updateStatistics();
    }

    function loadSampleTasks(notifyUser = true) {
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);
      const nextWeek = new Date(today);
      nextWeek.setDate(nextWeek.getDate() + 5);

      const formatDate = (d) => d.toISOString().split('T')[0];

      tasks = [
        {
          id: 'task_' + Date.now() + '_1',
          name: 'Finalize Software Engineering presentation slides',
          priority: 'high',
          dueDate: formatDate(today),
          completed: false,
          createdAt: Date.now() - 3600000 * 5
        },
        {
          id: 'task_' + Date.now() + '_2',
          name: 'Submit Database Systems lab report',
          priority: 'high',
          dueDate: formatDate(yesterday),
          completed: false,
          createdAt: Date.now() - 3600000 * 28
        },
        {
          id: 'task_' + Date.now() + '_3',
          name: 'Review Chapter 4 & 5 for upcoming midterm exam',
          priority: 'medium',
          dueDate: formatDate(tomorrow),
          completed: false,
          createdAt: Date.now() - 3600000 * 2
        },
        {
          id: 'task_' + Date.now() + '_4',
          name: 'Schedule group study session in library',
          priority: 'low',
          dueDate: formatDate(nextWeek),
          completed: false,
          createdAt: Date.now() - 3600000 * 1
        },
        {
          id: 'task_' + Date.now() + '_5',
          name: 'Set up Vite and Git repository for project demo',
          priority: 'medium',
          dueDate: formatDate(yesterday),
          completed: true,
          createdAt: Date.now() - 3600000 * 48
        }
      ];

      saveTasks();
      renderTasks();
      if (notifyUser) {
        showToast('Demo tasks successfully loaded!', 'info');
      }
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const prioritySelect = document.getElementById('prioritySelect');
      const dueDateInput = document.getElementById('dueDateInput');

      const name = input ? input.value.trim() : '';
      const priority = prioritySelect ? prioritySelect.value : 'medium';
      const dueDate = dueDateInput ? dueDateInput.value : '';

      if (!name) {
        showToast('Please enter a task name!', 'danger');
        if (input) input.focus();
        return;
      }

      const newTask = {
        id: 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        name: name,
        priority: priority,
        dueDate: dueDate,
        completed: false,
        createdAt: Date.now()
      };

      tasks.unshift(newTask);
      saveTasks();
      renderTasks();

      if (input) input.value = '';
      if (dueDateInput) dueDateInput.value = '';
      if (prioritySelect) prioritySelect.value = 'medium';
      if (input) input.focus();

      showToast(`Task "${escapeHtml(name)}" added successfully!`, 'success');
    }

    function completeTask(id) {
      const taskIndex = tasks.findIndex(t => t.id === id);
      if (taskIndex === -1) return;

      tasks[taskIndex].completed = !tasks[taskIndex].completed;
      saveTasks();
      renderTasks();

      if (tasks[taskIndex].completed) {
        showToast('Marked as completed! Great job! 🎉', 'success');
      } else {
        showToast('Task marked as pending.', 'info');
      }
    }

    function deleteTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      openConfirmModal(
        'Delete Task',
        `Are you sure you want to permanently delete: "${task.name}"?`,
        () => {
          tasks = tasks.filter(t => t.id !== id);
          saveTasks();
          renderTasks();
          showToast('Task was permanently deleted.', 'danger');
        }
      );
    }

    function editTask(id) {
      editingTaskId = id;
      renderTasks();
      const editInput = document.getElementById(`edit-input-${id}`);
      if (editInput) {
        editInput.focus();
        editInput.select();
      }
    }

    function saveEdit(id) {
      const editInput = document.getElementById(`edit-input-${id}`);
      const editPriority = document.getElementById(`edit-priority-${id}`);
      const editDueDate = document.getElementById(`edit-due-${id}`);

      if (!editInput) return;
      const newName = editInput.value.trim();

      if (!newName) {
        showToast('Task name cannot be empty!', 'danger');
        editInput.focus();
        return;
      }

      const taskIndex = tasks.findIndex(t => t.id === id);
      if (taskIndex !== -1) {
        tasks[taskIndex].name = newName;
        tasks[taskIndex].priority = editPriority ? editPriority.value : tasks[taskIndex].priority;
        tasks[taskIndex].dueDate = editDueDate ? editDueDate.value : tasks[taskIndex].dueDate;

        saveTasks();
        editingTaskId = null;
        renderTasks();
        showToast('Task updated successfully!', 'success');
      }
    }

    function cancelEdit() {
      editingTaskId = null;
      renderTasks();
    }

    function filterTasks(filterName) {
      currentFilter = filterName;
      const buttons = document.querySelectorAll('#filterTabs .filter-btn');
      buttons.forEach(btn => {
        if (btn.dataset.filter === filterName) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      renderTasks();
    }

    function searchTasks(query) {
      searchQuery = (query || '').trim().toLowerCase();
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) {
        clearBtn.style.display = searchQuery ? 'flex' : 'none';
      }
      renderTasks();
    }

    function clearSearch() {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = '';
      }
      searchTasks('');
      if (searchInput) searchInput.focus();
    }

    function sortTasks(sortType) {
      currentSort = sortType;
      renderTasks();
    }

    function confirmClearCompleted() {
      const completedCount = tasks.filter(t => t.completed).length;
      if (completedCount === 0) {
        showToast('No completed tasks to clear.', 'info');
        return;
      }

      openConfirmModal(
        'Clear Completed Tasks',
        `Are you sure you want to remove all ${completedCount} completed task(s)?`,
        () => {
          clearCompleted();
        }
      );
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      renderTasks();
      showToast('All completed tasks cleared!', 'info');
    }

    function confirmDeleteAll() {
      if (tasks.length === 0) {
        showToast('Your task list is already empty.', 'info');
        return;
      }

      openConfirmModal(
        'Delete All Tasks',
        `Are you sure you want to wipe all ${tasks.length} task(s)? This action cannot be undone.`,
        () => {
          deleteAllTasks();
        }
      );
    }

    function deleteAllTasks() {
      tasks = [];
      saveTasks();
      renderTasks();
      showToast('All tasks have been deleted.', 'danger');
    }

    function updateStatistics() {
      const todayStr = new Date().toISOString().split('T')[0];

      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const pending = tasks.filter(t => !t.completed).length;
      
      const overdue = tasks.filter(t => {
        return !t.completed && t.dueDate && t.dueDate < todayStr;
      }).length;

      const high = tasks.filter(t => t.priority === 'high' && !t.completed).length;

      const elTotal = document.getElementById('statTotalCount');
      const elComp = document.getElementById('statCompletedCount');
      const elPend = document.getElementById('statPendingCount');
      const elOverdue = document.getElementById('statOverdueCount');
      const elHigh = document.getElementById('statHighCount');

      if (elTotal) elTotal.textContent = total;
      if (elComp) elComp.textContent = completed;
      if (elPend) elPend.textContent = pending;
      if (elOverdue) elOverdue.textContent = overdue;
      if (elHigh) elHigh.textContent = high;

      const cAll = document.getElementById('countAll');
      const cPending = document.getElementById('countPending');
      const cCompleted = document.getElementById('countCompleted');
      const cHigh = document.getElementById('countHigh');
      const cMed = document.getElementById('countMedium');
      const cLow = document.getElementById('countLow');
      const cOver = document.getElementById('countOverdue');

      if (cAll) cAll.textContent = total;
      if (cPending) cPending.textContent = pending;
      if (cCompleted) cCompleted.textContent = completed;
      if (cHigh) cHigh.textContent = tasks.filter(t => t.priority === 'high').length;
      if (cMed) cMed.textContent = tasks.filter(t => t.priority === 'medium').length;
      if (cLow) cLow.textContent = tasks.filter(t => t.priority === 'low').length;
      if (cOver) cOver.textContent = overdue;

      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      const progressBar = document.getElementById('progressBarFill');
      const progressText = document.getElementById('progressPercentText');
      const progressBadge = document.getElementById('progressStatusBadge');

      if (progressBar) progressBar.style.width = `${percentage}%`;
      if (progressText) progressText.textContent = `${percentage}%`;

      if (progressBadge) {
        if (total === 0) {
          progressBadge.textContent = 'No tasks yet';
        } else if (percentage === 100) {
          progressBadge.textContent = 'All caught up! 🎉';
        } else if (percentage >= 75) {
          progressBadge.textContent = 'Almost finished! 🚀';
        } else if (percentage >= 50) {
          progressBadge.textContent = 'Halfway there! 💪';
        } else if (percentage > 0) {
          progressBadge.textContent = 'In progress ⏳';
        } else {
          progressBadge.textContent = 'Ready to begin 🎯';
        }
      }

      const footerSummary = document.getElementById('footerSummary');
      if (footerSummary) {
        footerSummary.textContent = `${completed} of ${total} tasks completed (${percentage}%)`;
      }
    }

    function renderTasks() {
      const container = document.getElementById('taskList');
      if (!container) return;

      const todayStr = new Date().toISOString().split('T')[0];

      let filtered = tasks.filter(task => {
        if (searchQuery && !task.name.toLowerCase().includes(searchQuery)) {
          return false;
        }

        switch (currentFilter) {
          case 'pending':
            return !task.completed;
          case 'completed':
            return task.completed;
          case 'high':
            return task.priority === 'high';
          case 'medium':
            return task.priority === 'medium';
          case 'low':
            return task.priority === 'low';
          case 'overdue':
            return !task.completed && task.dueDate && task.dueDate < todayStr;
          case 'all':
          default:
            return true;
        }
      });

      filtered.sort((a, b) => {
        if (currentSort === 'newest') return b.createdAt - a.createdAt;
        if (currentSort === 'oldest') return a.createdAt - b.createdAt;
        if (currentSort === 'priority') {
          const weight = { high: 3, medium: 2, low: 1 };
          return weight[b.priority] - weight[a.priority];
        }
        if (currentSort === 'due-date') {
          if (!a.dueDate) return 1;
          if (!b.dueDate) return -1;
          return a.dueDate.localeCompare(b.dueDate);
        }
        if (currentSort === 'alphabetical') {
          return a.name.localeCompare(b.name);
        }
        return 0;
      });

      if (filtered.length === 0) {
        container.innerHTML = getEmptyStateHtml();
        return;
      }

      container.innerHTML = filtered.map(task => {
        if (task.id === editingTaskId) {
          return getEditCardHtml(task);
        }
        return getTaskCardHtml(task, todayStr);
      }).join('');
    }

    function getTaskCardHtml(task, todayStr) {
      const isCompleted = task.completed;
      const isOverdue = !isCompleted && task.dueDate && task.dueDate < todayStr;
      const isDueToday = !isCompleted && task.dueDate && task.dueDate === todayStr;

      let priorityClass = 'badge-medium';
      let priorityText = 'Medium';
      if (task.priority === 'high') {
        priorityClass = 'badge-high';
        priorityText = 'High';
      } else if (task.priority === 'low') {
        priorityClass = 'badge-low';
        priorityText = 'Low';
      }

      let dueBadgeHtml = '';
      if (task.dueDate) {
        const dueDateObj = new Date(task.dueDate + 'T00:00:00');
        const formattedDate = dueDateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        if (isOverdue) {
          dueBadgeHtml = `
            <span class="due-badge overdue" title="This task is overdue!">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
              Overdue: ${formattedDate}
            </span>
          `;
        } else if (isDueToday) {
          dueBadgeHtml = `
            <span class="due-badge today" title="Due today!">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Due Today
            </span>
          `;
        } else {
          dueBadgeHtml = `
            <span class="due-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              Due ${formattedDate}
            </span>
          `;
        }
      }

      const createdObj = new Date(task.createdAt);
      const formattedCreated = createdObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
                               createdObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

      return `
        <article class="task-card ${isCompleted ? 'is-completed' : ''}" data-task-id="${task.id}" id="${task.id}">
          <div class="task-checkbox-wrapper">
            <button 
              type="button" 
              class="custom-checkbox btn-toggle-complete" 
              data-id="${task.id}"
              role="checkbox" 
              aria-checked="${isCompleted}" 
              aria-label="Mark task as ${isCompleted ? 'pending' : 'completed'}"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>

          <div class="task-content">
            <div class="task-title">${escapeHtml(task.name)}</div>
            
            <div class="task-meta-row">
              <span class="priority-badge ${priorityClass}">
                <span class="dot"></span>
                ${priorityText}
              </span>

              ${dueBadgeHtml}

              <span class="created-time" title="Created on ${formattedCreated}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                ${formattedCreated}
              </span>
            </div>
          </div>

          <div class="task-actions">
            <button 
              type="button" 
              class="task-action-btn btn-edit-trigger" 
              data-id="${task.id}"
              title="Edit task" 
              aria-label="Edit task"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>

            <button 
              type="button" 
              class="task-action-btn btn-delete btn-delete-trigger" 
              data-id="${task.id}"
              title="Delete task" 
              aria-label="Delete task"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>
        </article>
      `;
    }

    function getEditCardHtml(task) {
      return `
        <article class="task-card" data-task-id="${task.id}" id="${task.id}" style="border-color: var(--primary);">
          <div class="task-edit-panel">
            <input 
              type="text" 
              id="edit-input-${task.id}" 
              class="task-edit-input" 
              value="${escapeHtml(task.name)}" 
            />
            
            <div class="task-edit-controls">
              <div class="task-edit-fields">
                <select id="edit-priority-${task.id}" class="custom-select">
                  <option value="high" ${task.priority === 'high' ? 'selected' : ''}>🔴 High Priority</option>
                  <option value="medium" ${task.priority === 'medium' ? 'selected' : ''}>🟡 Medium Priority</option>
                  <option value="low" ${task.priority === 'low' ? 'selected' : ''}>🟢 Low Priority</option>
                </select>

                <input 
                  type="date" 
                  id="edit-due-${task.id}" 
                  class="date-input" 
                  value="${task.dueDate || ''}" 
                />
              </div>

              <div class="task-edit-buttons">
                <button type="button" class="btn-edit-save" data-id="${task.id}">Save Changes</button>
                <button type="button" class="btn-edit-cancel">Cancel</button>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function getEmptyStateHtml() {
      let title = "No tasks found";
      let desc = "You don't have any tasks matching your current view.";
      let actionBtn = `<button type="button" class="btn-empty-action btn-view-all">View All Tasks</button>`;

      if (tasks.length === 0) {
        title = "No tasks yet!";
        desc = "Organize your day, track priorities, and stay productive. Add your first task above!";
        actionBtn = `<button type="button" class="btn-empty-action btn-load-demo">Load Demo Tasks</button>`;
      } else if (currentFilter === 'completed') {
        title = "No completed tasks yet";
        desc = "Check off tasks as you finish them to track your accomplishments!";
      } else if (currentFilter === 'overdue') {
        title = "Zero overdue tasks!";
        desc = "You're completely on schedule with your deadlines. Keep it up!";
      } else if (searchQuery) {
        title = `No results for "${escapeHtml(searchQuery)}"`;
        desc = "Try searching for a different keyword or check your spelling.";
        actionBtn = `<button type="button" class="btn-empty-action btn-clear-search">Clear Search</button>`;
      }

      return `
        <div class="empty-state">
          <div class="empty-icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
          </div>
          <h3 class="empty-title">${title}</h3>
          <p class="empty-desc">${desc}</p>
          ${actionBtn}
        </div>
      `;
    }

    function openConfirmModal(title, message, onConfirm) {
      const modal = document.getElementById('confirmModal');
      const titleEl = document.getElementById('modalTitle');
      const msgEl = document.getElementById('modalMessage');
      const confirmBtn = document.getElementById('modalConfirmBtn');

      if (!modal || !confirmBtn) return;

      titleEl.textContent = title;
      msgEl.textContent = message;

      pendingModalAction = onConfirm;

      modal.classList.add('active');
    }

    function closeConfirmModal() {
      const modal = document.getElementById('confirmModal');
      if (modal) {
        modal.classList.remove('active');
      }
      pendingModalAction = null;
    }

    function initTheme() {
      const savedTheme = safeGetStorage(THEME_KEY);
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      const theme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
      applyTheme(theme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
      safeSetStorage(THEME_KEY, newTheme);
      showToast(`Switched to ${newTheme} mode`, 'info');
    }

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        const sun = document.getElementById('themeIconSun');
        const moon = document.getElementById('themeIconMoon');
        const text = document.getElementById('themeToggleText');
        if (sun) sun.style.display = 'block';
        if (moon) moon.style.display = 'none';
        if (text) text.textContent = 'Light Mode';
      } else {
        document.documentElement.removeAttribute('data-theme');
        const sun = document.getElementById('themeIconSun');
        const moon = document.getElementById('themeIconMoon');
        const text = document.getElementById('themeToggleText');
        if (sun) sun.style.display = 'none';
        if (moon) moon.style.display = 'block';
        if (text) text.textContent = 'Dark Mode';
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;

      let iconSvg = '';
      if (type === 'success') {
        iconSvg = `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
      } else if (type === 'danger') {
        iconSvg = `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
      } else {
        iconSvg = `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
      }

      toast.innerHTML = `
        ${iconSvg}
        <div class="toast-message">${message}</div>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('hide');
        setTimeout(() => {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 300);
      }, 3200);
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Attach all functions explicitly to window for global access
    window.addTask = addTask;
    window.completeTask = completeTask;
    window.deleteTask = deleteTask;
    window.editTask = editTask;
    window.saveEdit = saveEdit;
    window.cancelEdit = cancelEdit;
    window.filterTasks = filterTasks;
    window.searchTasks = searchTasks;
    window.clearSearch = clearSearch;
    window.sortTasks = sortTasks;
    window.loadSampleTasks = loadSampleTasks;
    window.confirmClearCompleted = confirmClearCompleted;
    window.clearCompleted = clearCompleted;
    window.confirmDeleteAll = confirmDeleteAll;
    window.deleteAllTasks = deleteAllTasks;
    window.toggleTheme = toggleTheme;
    window.closeConfirmModal = closeConfirmModal;

    /**
     * ========================================================================
     * EVENT LISTENERS INITIALIZATION (Direct & Delegated)
     * ========================================================================
     */
    function attachEventListeners() {
      // 1. Theme toggle
      const themeBtn = document.getElementById('themeToggleBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', (e) => {
          e.preventDefault();
          toggleTheme();
        });
      }

      // 2. Add task form & button
      const addForm = document.getElementById('addTaskForm');
      if (addForm) {
        addForm.addEventListener('submit', (e) => {
          e.preventDefault();
          addTask();
        });
      }

      const addBtn = document.getElementById('addTaskBtn');
      if (addBtn) {
        addBtn.addEventListener('click', (e) => {
          e.preventDefault();
          addTask();
        });
      }

      // 3. Search and sort
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchTasks(e.target.value);
        });
      }

      const searchClearBtn = document.getElementById('searchClearBtn');
      if (searchClearBtn) {
        searchClearBtn.addEventListener('click', (e) => {
          e.preventDefault();
          clearSearch();
        });
      }

      const sortSelect = document.getElementById('sortSelect');
      if (sortSelect) {
        sortSelect.addEventListener('change', (e) => {
          sortTasks(e.target.value);
        });
      }

      // 4. Filter tabs (delegated click listener)
      const filterTabs = document.getElementById('filterTabs');
      if (filterTabs) {
        filterTabs.addEventListener('click', (e) => {
          const btn = e.target.closest('.filter-btn');
          if (btn && btn.dataset.filter) {
            e.preventDefault();
            filterTasks(btn.dataset.filter);
          }
        });
      }

      // 5. Footer action buttons
      const btnResetDemo = document.getElementById('btnResetDemo');
      if (btnResetDemo) {
        btnResetDemo.addEventListener('click', (e) => {
          e.preventDefault();
          loadSampleTasks(true);
        });
      }

      const btnClearCompleted = document.getElementById('btnClearCompleted');
      if (btnClearCompleted) {
        btnClearCompleted.addEventListener('click', (e) => {
          e.preventDefault();
          confirmClearCompleted();
        });
      }

      const btnDeleteAll = document.getElementById('btnDeleteAll');
      if (btnDeleteAll) {
        btnDeleteAll.addEventListener('click', (e) => {
          e.preventDefault();
          confirmDeleteAll();
        });
      }

      // 6. Confirmation modal buttons & backdrop
      const modal = document.getElementById('confirmModal');
      const modalCancel = document.getElementById('modalCancelBtn');
      const modalConfirm = document.getElementById('modalConfirmBtn');

      if (modalCancel) {
        modalCancel.addEventListener('click', (e) => {
          e.preventDefault();
          closeConfirmModal();
        });
      }

      if (modalConfirm) {
        modalConfirm.addEventListener('click', (e) => {
          e.preventDefault();
          if (typeof pendingModalAction === 'function') {
            pendingModalAction();
          }
          closeConfirmModal();
        });
      }

      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            closeConfirmModal();
          }
        });
      }

      // 7. Global Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeConfirmModal();
          if (editingTaskId) cancelEdit();
        }
      });

      // 8. Task list event delegation (handles checkboxes, edit triggers, delete triggers, edit saving, empty actions)
      const taskList = document.getElementById('taskList');
      if (taskList) {
        taskList.addEventListener('click', (e) => {
          // Checkbox toggle
          const checkbox = e.target.closest('.btn-toggle-complete');
          if (checkbox) {
            e.preventDefault();
            const id = checkbox.dataset.id || checkbox.closest('.task-card')?.dataset.taskId;
            if (id) completeTask(id);
            return;
          }

          // Edit button trigger
          const editBtn = e.target.closest('.btn-edit-trigger');
          if (editBtn) {
            e.preventDefault();
            const id = editBtn.dataset.id || editBtn.closest('.task-card')?.dataset.taskId;
            if (id) editTask(id);
            return;
          }

          // Delete button trigger
          const deleteBtn = e.target.closest('.btn-delete-trigger');
          if (deleteBtn) {
            e.preventDefault();
            const id = deleteBtn.dataset.id || deleteBtn.closest('.task-card')?.dataset.taskId;
            if (id) deleteTask(id);
            return;
          }

          // Save edit button inside edit panel
          const saveBtn = e.target.closest('.btn-edit-save');
          if (saveBtn) {
            e.preventDefault();
            const id = saveBtn.dataset.id || saveBtn.closest('.task-card')?.dataset.taskId;
            if (id) saveEdit(id);
            return;
          }

          // Cancel edit button inside edit panel
          const cancelBtn = e.target.closest('.btn-edit-cancel');
          if (cancelBtn) {
            e.preventDefault();
            cancelEdit();
            return;
          }

          // Empty state actions
          const viewAllBtn = e.target.closest('.btn-view-all');
          if (viewAllBtn) {
            e.preventDefault();
            filterTasks('all');
            clearSearch();
            return;
          }

          const loadDemoBtn = e.target.closest('.btn-load-demo');
          if (loadDemoBtn) {
            e.preventDefault();
            loadSampleTasks(true);
            return;
          }

          const clearSearchBtn = e.target.closest('.btn-clear-search');
          if (clearSearchBtn) {
            e.preventDefault();
            clearSearch();
            return;
          }
        });

        // Keydown listener for inline edit input (Enter to save, Escape to cancel)
        taskList.addEventListener('keydown', (e) => {
          if (e.target && e.target.classList.contains('task-edit-input')) {
            const card = e.target.closest('.task-card');
            const id = card ? card.dataset.taskId : null;
            if (!id) return;

            if (e.key === 'Enter') {
              e.preventDefault();
              saveEdit(id);
            } else if (e.key === 'Escape') {
              e.preventDefault();
              cancelEdit();
            }
          }
        });
      }
    }

    // Startup initialization
    document.addEventListener('DOMContentLoaded', () => {
      initCurrentDate();
      initTheme();
      loadTasks();
      attachEventListeners();
    });

    // In case DOM is already loaded
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      initCurrentDate();
      initTheme();
      loadTasks();
      attachEventListeners();
    }
  </script>
</body>
</html>
